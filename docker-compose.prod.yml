name: viratec-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viratec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viratec_password}
      POSTGRES_DB: ${POSTGRES_DB:-viratec_db}
    command:
      - 'postgres'
      - '-c'
      - 'shared_buffers=128MB'
      - '-c'
      - 'work_mem=8MB'
      - '-c'
      - 'max_connections=100'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-viratec_user} -d ${POSTGRES_DB:-viratec_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-viratec_redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-viratec_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-viratec_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-viratec_minio_secret_pass}
    volumes:
      - minio_prod_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - internal
      - public
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
      - internal
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-viratec_minio_admin} ${MINIO_ROOT_PASSWORD:-viratec_minio_secret_pass};
      mc mb -p local/viratec-docs;
      mc mb -p local/viratec-media;
      mc anonymous set download local/viratec-docs;
      mc anonymous set download local/viratec-media;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: ${DOCKER_REGISTRY:-viratec}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-viratec_user}:${POSTGRES_PASSWORD:-viratec_password}@postgres:5432/${POSTGRES_DB:-viratec_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-viratec_redis_secret}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-viratec_prod_access_secret_super_secure}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-viratec_prod_refresh_secret_super_secure}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PORT: 3000
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viratec_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-viratec_minio_secret_pass}
      S3_BUCKET_DOCS: viratec-docs
      S3_BUCKET_MEDIA: viratec-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${DOCKER_REGISTRY:-viratec}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Optional Monitoring Profile
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
      - public
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_viratec}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal
      - public
    ports:
      - '3001:3000'

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
