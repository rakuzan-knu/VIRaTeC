apiVersion: apps/v1
kind: Deployment
metadata:
  name: viratec-backend
  labels:
    app: viratec-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viratec-backend
  template:
    metadata:
      labels:
        app: viratec-backend
    spec:
      containers:
        - name: backend
          image: viratec/backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: viratec-config
            - secretRef:
                name: viratec-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: viratec-backend-service
spec:
  selector:
    app: viratec-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
