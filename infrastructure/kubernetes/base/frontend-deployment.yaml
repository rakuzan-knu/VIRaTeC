apiVersion: apps/v1
kind: Deployment
metadata:
  name: viratec-frontend
  labels:
    app: viratec-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viratec-frontend
  template:
    metadata:
      labels:
        app: viratec-frontend
    spec:
      containers:
        - name: frontend
          image: viratec/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: viratec-frontend-service
spec:
  selector:
    app: viratec-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
