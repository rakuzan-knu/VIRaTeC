name: viratec-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viratec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viratec_password}
      POSTGRES_DB: ${POSTGRES_DB:-viratec_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-viratec_user} -d ${POSTGRES_DB:-viratec_db}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
      - public

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-viratec_redis_secret}
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-viratec_redis_secret}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
      - public

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-viratec_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-viratec_minio_secret_pass}
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
      - public

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
      - internal
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-viratec_minio_admin} ${MINIO_ROOT_PASSWORD:-viratec_minio_secret_pass};
      mc mb -p local/viratec-docs;
      mc mb -p local/viratec-media;
      mc anonymous set download local/viratec-docs;
      mc anonymous set download local/viratec-media;
      echo 'MinIO buckets provisioned.';
      exit 0;
      "

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  minio_dev_data:
    driver: local

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
