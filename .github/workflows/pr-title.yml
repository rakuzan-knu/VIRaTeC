name: Validate PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Convention
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            style
            test
            perf
            ci
            revert
            optimization
            merge
          scopes: |
            auth
            research
            projects
            events
            community
            users
            infra
            ui
            backend
            web
            contracts
            deps
            docs
            ci
          requireScope: false
