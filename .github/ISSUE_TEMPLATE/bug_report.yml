name: 🐛 Повідомлення про помилку (Bug Report)
description: Створити звіт про помилку для покращення платформи VIRaTeC
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Дякуємо за допомогу у знаходженні проблем у платформі VIRaTeC!
  - type: textarea
    id: description
    attributes:
      label: Опис проблеми
      description: Чіткий і стислий опис того, що саме працює некоректно.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Кроки для відтворення
      description: Покроковий алгоритм, як відтворити помилку.
      placeholder: |
        1. Відкрити сторінку '...'
        2. Натиснути на '...'
        3. Побачити помилку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Очікувана поведінка
      description: Що мало відбутися за нормальних умов.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Компонент системи
      options:
        - apps/backend (NestJS API)
        - apps/web (React SPA)
        - packages/contracts
        - Docker / Інфраструктура
        - Інше
    validations:
      required: true
